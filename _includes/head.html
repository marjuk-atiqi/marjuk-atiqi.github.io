{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  @media (min-width: 1024px) {
    /* সাইডবারের মাপ */
    .sidebar {
      width: 290px !important; 
    }
    
    /* মেইন কন্টেন্টের বাম দিকে দাগ দেওয়া, যাতে সব পেজে দাগটি থাকে */
    .page, .archive {
      width: calc(100% - 330px) !important; 
      float: right !important;
      border-left: 1px solid #e2e8f0 !important; /* এই লাইনটি সব পেজে বর্ডার দেখাবে */
      padding-left: 30px !important; /* বর্ডার থেকে লেখার দূরত্ব */
      min-height: 80vh; /* পেজে লেখা কম থাকলেও দাগটা লম্বা দেখাবে */
    }
    
    /* প্রোফাইল ছবির সাইজ আরও বড় করা (আগে 135px ছিল, এখন 180px দেওয়া হলো) */
    .author__avatar img {
      max-width: 180px !important; 
      width: 100% !important;
      height: auto !important;
    }
  }
</style>
