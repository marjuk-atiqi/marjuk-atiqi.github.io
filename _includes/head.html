{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  @media (min-width: 1024px) {
    /* সাইডবারের মাপ, আরও গাঢ় ব্যাকগ্রাউন্ড কালার এবং শ্যাডো */
    .sidebar {
      width: 290px !important; 
      background-color: #e2e8f0 !important; /* কালারটি এবার স্পষ্ট বোঝা যাবে */
      padding: 25px 20px !important; 
      border-radius: 12px !important; 
      box-sizing: border-box !important;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06) !important; /* শ্যাডো আরেকটু ক্লিয়ার করা হয়েছে */
    }
    
    /* মেইন কন্টেন্টের বাম দিকের দাগ এবং দূরত্ব */
    .page, .archive {
      width: calc(100% - 330px) !important; 
      float: right !important;
      border-left: 1px solid #cbd5e1 !important; /* দাগটিও একটু গাঢ় করা হয়েছে */
      padding-left: 30px !important; 
      min-height: 80vh; 
    }
    
    /* প্রোফাইল ছবির সাইজ */
    .author__avatar img {
      max-width: 180px !important; 
      width: 100% !important;
      height: auto !important;
    }
  }
</style>
