{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  @media (min-width: 1024px) {
    /* সাইডবারের মাপ এবং ফেসবুক ব্লু ব্যাকগ্রাউন্ড */
    .sidebar {
      width: 290px !important; 
      background-color: #1877F2 !important; /* Facebook Blue */
      padding: 25px 20px !important; 
      border-radius: 12px !important; 
      box-sizing: border-box !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15) !important; 
    }
    
    /* সাইডবারের ভেতরের সব লেখা, নাম, লিংক এবং আইকন সাদা করার জন্য */
    .sidebar, .sidebar p, .sidebar h1, .sidebar h2, .sidebar h3, 
    .sidebar h4, .sidebar a, .sidebar .author__name, 
    .sidebar .author__bio, .sidebar .author__urls li, 
    .sidebar .author__urls li a, .sidebar i, .sidebar svg,
    .sidebar .author__urls-wrapper button {
      color: #ffffff !important; 
    }
    
    /* মেইন কন্টেন্টের বাম দিকের দাগ এবং দূরত্ব */
    .page, .archive {
      width: calc(100% - 330px) !important; 
      float: right !important;
      border-left: 1px solid #e2e8f0 !important; 
      padding-left: 30px !important; 
      min-height: 80vh; 
    }
    
    /* প্রোফাইল ছবির সাইজ এবং সাদা বর্ডার */
    .author__avatar img {
      max-width: 180px !important; 
      width: 100% !important;
      height: auto !important;
      border: 3px solid #ffffff !important; /* ছবির চারপাশে সাদা বর্ডার */
      padding: 3px !important;
      background-color: #ffffff !important;
    }
  }
</style>
