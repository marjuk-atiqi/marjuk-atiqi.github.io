{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  @media (min-width: 1024px) {
    /* সাইডবারের পারফেক্ট মাপ এবং ডানদিকের হালকা বর্ডার */
    .sidebar {
      width: 280px !important; 
      border-right: 1px solid #e2e8f0 !important; /* ডানদিকের হালকা গ্রে বর্ডার */
      padding-right: 25px !important; /* বর্ডার থেকে ভেতরের লেখার দূরত্ব */
    }
    
    /* মেইন কন্টেন্ট যেন সাইডবারের বর্ডারের সাথে লেগে না যায় */
    .page, .archive {
      width: calc(100% - 330px) !important; 
      float: right !important;
    }
    
    /* প্রোফাইল ছবির সাইজ সুন্দরভাবে ব্যালান্স করা */
    .author__avatar img {
      max-width: 135px !important; 
    }
  }
</style>
