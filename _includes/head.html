{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  @media (min-width: 1024px) {
    /* সাইডবারের মাপ, ব্যাকগ্রাউন্ড কালার এবং ডিজাইন */
    .sidebar {
      width: 290px !important; 
      background-color: #f8fafc !important; /* হালকা গ্রে-ব্লু ব্যাকগ্রাউন্ড */
      padding: 25px 20px !important; /* চারপাশের ফাঁকা জায়গা */
      border-radius: 16px !important; /* বক্সের কোণাগুলো সুন্দর গোল করার জন্য */
      box-sizing: border-box !important;
    }
    
    /* মেইন কন্টেন্টের বাম দিকের দাগ এবং দূরত্ব */
    .page, .archive {
      width: calc(100% - 330px) !important; 
      float: right !important;
      border-left: 1px solid #e2e8f0 !important; 
      padding-left: 30px !important; 
      min-height: 80vh; 
    }
    
    /* প্রোফাইল ছবির সাইজ */
    .author__avatar img {
      max-width: 180px !important; 
      width: 100% !important;
      height: auto !important;
    }
  }
</style>
